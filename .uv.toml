[uv]
# Use the system Python interpreter
system = true

# Exclude these directories from being considered as Python packages
exclude = [
    "venv*",
    ".venv",
    ".git",
    "__pycache__",
    "*.egg-info",
]

# Default pip options
pip-args = ["--no-cache-dir"]

[uv.dev-dependencies]
# Development dependencies
pytest = "^7.2.1"
pytest-cov = "^4.1.0"
flake8 = "^6.0.0"
mypy = "^1.3.0"
black = "^23.3.0"
isort = "^5.12.0" 