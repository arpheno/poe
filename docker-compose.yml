version: '3.8'

services:
  # Django backend service
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: your-api
    volumes:
      - ./poe:/app/poe
      - ./packages/your-api:/app/packages/your-api
      - static_volume:/app/packages/your-api/static
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=${DEBUG}
      - SECRET_KEY=${SECRET_KEY}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS}
    command: >
      sh -c "cd packages/your-api && 
             python manage.py migrate &&
             python manage.py collectstatic --no-input &&
             python manage.py runserver 0.0.0.0:8000"
    restart: unless-stopped

  # Angular frontend service
  frontend:
    build:
      context: ./packages/your-web
      dockerfile: Dockerfile
    container_name: your-web
    ports:
      - "4200:80"
    depends_on:
      - backend
    environment:
      - BACKEND_URL=${BACKEND_URL}
    restart: unless-stopped

volumes:
  static_volume:
