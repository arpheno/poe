version: '3.8'

services:
  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    ports:
      - "8999:8999"
    volumes:
      - .:/app
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - POE_PROXY_URL=http://proxy:8999
    depends_on:
      - proxy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/poe-trade-search
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/poe-trade-search:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000
      - API_TARGET=http://backend:8000
    restart: unless-stopped
